<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube 双语字幕</title>
  <style>
    body {
      width: 260px;
      padding: 12px 16px;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      font-size: 14px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    p {
      margin: 12px 0 0;
      color: #666;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h2>YouTube 双语字幕</h2>
  <label>
    <input type="checkbox" id="enabled" checked>
    在英语字幕下显示中文翻译
  </label>
  <label style="margin-top:8px;display:block;">
    <input type="checkbox" id="debug">
    调试模式（在控制台输出日志）
  </label>
  <p>请先在视频中开启英文字幕（CC），翻译将自动显示在下方。</p>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube双语字幕</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #ff0000;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 12px;
            color: #888;
        }
        
        .status {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            color: #ccc;
            font-size: 14px;
        }
        
        .status-value {
            font-weight: 600;
            font-size: 14px;
        }
        
        .status-value.online {
            color: #4CAF50;
        }
        
        .status-value.offline {
            color: #f44336;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: #ff0000;
            color: white;
        }
        
        .btn-primary:hover {
            background: #cc0000;
        }
        
        .btn-secondary {
            background: #333;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #555;
        }
        
        .info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            color: #ccc;
        }
        
        .info h4 {
            margin: 0 0 10px 0;
            color: #4CAF50;
            font-size: 14px;
        }
        
        .info ul {
            margin: 0;
            padding-left: 20px;
        }
        
        .info li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎥</div>
        <div class="title">YouTube双语字幕</div>
        <div class="subtitle">实时双语字幕 + Google翻译</div>
    </div>
    
    <div class="status">
        <div class="status-item">
            <span class="status-label">插件状态:</span>
            <span class="status-value online" id="plugin-status">已启用</span>
        </div>
        <div class="status-item">
            <span class="status-label">字幕捕获:</span>
            <span class="status-value online" id="subtitle-status">运行中</span>
        </div>
        <div class="status-item">
            <span class="status-label">翻译服务:</span>
            <span class="status-value online" id="translation-status">Google翻译</span>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn btn-primary" id="toggle-plugin">禁用插件</button>
        <button class="btn btn-secondary" id="open-settings">设置</button>
    </div>
    
    <div class="info">
        <h4>使用说明:</h4>
        <ul>
            <li>在YouTube视频页面自动显示双语字幕</li>
            <li>支持英文原文 + 中文翻译</li>
            <li>可拖拽移动字幕窗口</li>
            <li>支持显示/隐藏字幕内容</li>
        </ul>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
